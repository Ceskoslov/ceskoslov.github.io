base_url = "https://ceskoslov.github.io"
title = "Ceskoslov"
description = "Notes on life."
default_language = "en"
ignored_content = ["*:Zone.Identifier", "**/*:Zone.Identifier"]
compile_sass = false
minify_html = true
generate_feeds = true
feed_filenames = ["atom.xml"]
generate_sitemap = true
generate_robots_txt = true

taxonomies = [{ name = "tags", feed = true }]

[markdown]
smart_punctuation = true
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = true

[markdown.highlighting]
style = "inline"
theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
author = "ceskoslov"
profile_intro = "Notes on ..."
featured_posts = [
  "writing/2026-09-17-building-a-trustworthy-agent-runtime.md",
  "writing/2026-08-19-building-a-living-atlas.md",
]
social_image = "assets/images/social-card.png"
github_username = "ceskoslov"
