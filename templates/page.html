{% extends "base.html" %}

{% block body_class %}page-page{% endblock body_class %}

{% block content %}
<article class="page-shell">
  <header class="page-header">
    <p class="eyebrow"><span></span> {{ page.extra.kicker | default(value="Index / Overview") }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="page-content">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
